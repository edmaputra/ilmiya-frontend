server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/wasm
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Kubernetes Liveness & Readiness Probe
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Vault / Consul Dynamic Runtime Config
    # Matches /assets/config.json, /assets/assets/config.json, and /config.json
    location ~* ^/(assets/)?(assets/)?config\.json$ {
        if (-f /vault/secrets/config.json) {
            rewrite ^ /vault_config last;
        }
        try_files /assets/assets/config.json /assets/config.json =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        default_type application/json;
    }

    location = /vault_config {
        internal;
        alias /vault/secrets/config.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        default_type application/json;
    }

    # Cache static immutable assets aggressively (1 year)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Do not cache HTML, version metadata, or service worker
    location ~* (?:index\.html|version\.json|flutter_service_worker\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Single Page Application (SPA) Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
