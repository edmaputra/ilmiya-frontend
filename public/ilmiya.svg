<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient Matching the App Artwork -->
    <linearGradient id="ilmiyaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D7A82" />
      <stop offset="50%" stop-color="#1E6570" />
      <stop offset="100%" stop-color="#144C57" />
    </linearGradient>

    <linearGradient id="naturalBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B7D5D" />
      <stop offset="100%" stop-color="#4E5C43" />
    </linearGradient>
    
    <!-- Soft shadow filter -->
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#051c22" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#ilmiyaBgGrad)" filter="url(#iconShadow)" />

  <!-- Inner Soft Inset Glow -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3" />

  <!-- Vector Group: Graduation Cap and Book Mark in White -->
  <g transform="translate(0, -22)" fill="#FFFFFF">
    <!-- Mortarboard Diamond -->
    <polygon points="256,120 380,166 256,212 132,166" />
    
    <!-- Skull Cap Base -->
    <path d="M190 186 V216 C190 240 322 240 322 216 V186" />
    
    <!-- Tassel -->
    <path d="M336 178 C338 205 341 228 341 242 C335 248 340 258 344 258 C348 258 353 248 347 242 C347 228 344 205 342 178 Z" />

    <!-- Open Book Outer Pages Left -->
    <path d="M130 252 C130 248 134 244 138 244 C142 244 146 248 146 252 V336 C146 350 182 362 248 376 V392 C176 378 130 364 130 342 Z" />
    
    <!-- Open Book Outer Pages Right -->
    <path d="M382 252 C382 248 378 244 374 244 C370 244 366 248 366 252 V336 C366 350 330 362 264 376 V392 C336 378 382 364 382 342 Z" />

    <!-- Open Book Inner Main Left Page -->
    <path d="M172 232 C178 228 238 228 250 248 V356 C232 342 182 340 178 342 C174 342 172 340 172 336 V236 C172 232 174 232 172 232 Z" />

    <!-- Open Book Inner Main Right Page -->
    <path d="M340 232 C334 228 274 228 262 248 V356 C280 342 330 340 334 342 C338 342 340 340 340 336 V236 C340 232 338 232 340 232 Z" />

    <!-- Bottom Spine Ribbon Arc -->
    <path d="M136 356 C190 382 240 398 256 406 C272 398 322 382 376 356 C382 354 386 358 384 364 C360 394 304 416 256 418 C208 416 152 394 128 364 C126 358 130 354 136 356 Z" />
  </g>

  <!-- Ilmiya Typography Wordmark -->
  <text x="256" y="420" font-family="'Lora', 'Newsreader', Georgia, serif" font-size="64" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">Ilmiya</text>
</svg>
