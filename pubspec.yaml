name: ilmiya_app
description: "Ilmiya - Multiplatform School Information System (SIS) for iOS, Android, Web, and Desktop."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Typography & Design
  google_fonts: ^8.2.1
  intl: ">=0.19.0 <1.0.0"

  # Icons & Charts
  cupertino_icons: ^1.0.8
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
