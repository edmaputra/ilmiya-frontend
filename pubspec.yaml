name: ilmiya_app
description: "Ilmiya - Multiplatform School Information System (SIS) for iOS, Android, Web, and Desktop."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Typography & Design
  google_fonts: ^8.2.1
  intl: ">=0.19.0 <1.0.0"

  # Icons & Charts
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  fl_chart: ^1.2.0
  lucide_icons_flutter: ^3.1.20

  # Kite UI & Shadcn Design System
  shadcn_ui: ^0.55.1
  kite_ui:
    path: packages/kite_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# ── App Icon Generation ────────────────────────────────────────────────────────
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icons/icon.png"
  # iOS — transparent background, let iOS apply its own rounded-rect mask
  ios: true
  remove_alpha_ios: false
  # Android icons already generated into mipmap-* dirs; manifest not present
  android: false
  # macOS
  macos:
    generate: true
    image_path: "assets/icons/icon.png"
  # Web
  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#2563EB"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
